# =============================================================================
# Frontend release — build ghcr.io/fantasy-academy/frontend and deploy it to lily.
# =============================================================================
# Same shared ship workflow as the backend, but a DIFFERENT app slug and a
# DIFFERENT HMAC secret, so this pipeline can only ever roll the frontend.
# See .github/workflows/backend-release.yml for the full rationale, and
# lily.srv docs/decisions.md → D42.
#
# Migrated from spare.srv 2026-07-27: was rsync + ssh-action into
# /deployment/fantasy-academy on spare with a full SSH key in CI.
#
# BUILD SECRET vs BUILD ARG — the one thing to be careful about here:
#   - VITE_SENTRY_DSN is a build ARG. A Sentry DSN is PUBLIC by design (it ships
#     inside the JS bundle that every visitor downloads), so baking it into image
#     metadata costs nothing.
#   - SENTRY_AUTH_TOKEN is a real secret and is passed as a BuildKit SECRET MOUNT
#     (`secrets:` -> `RUN --mount=type=secret` in frontend/Dockerfile), never as a
#     build arg: the shared _build.yml emits SLSA provenance by default, and build
#     args are recorded in that attestation — a build arg would publish the token.
# =============================================================================

name: Frontend release

permissions:
  contents: read
  packages: write

on:
  workflow_run:
    workflows: [Frontend tests]
    types:
      - completed
    branches:
      - main

jobs:
  ship:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    uses: TheDevs-cz/ci/.github/workflows/_ship.yml@v1
    permissions:
      contents: read
      packages: write
    with:
      app: fantasy-academy-frontend
      # Image is named after the COMPONENT, not the repo.
      image: ghcr.io/fantasy-academy/frontend
      context: ./frontend
      # The Dockerfile is multi-stage (dev -> build -> runner); ship the nginx
      # runner stage, not the toolchain.
      target: runner
      # NON-SECRET only. VITE_* values are compiled into the public JS bundle.
      build_args: |
        APP_VERSION=${{ github.sha }}
        VITE_APP_VERSION=${{ github.sha }}
        VITE_SENTRY_DSN=${{ secrets.FRONTEND_SENTRY_DSN }}
      deploy_sha: true
      # See backend-release.yml — needs a per-app PAT on the box first.
      await_deploy: false
    secrets:
      DEPLOY_WEBHOOK_SECRET: ${{ secrets.DEPLOY_WEBHOOK_SECRET_FRONTEND }}
      # Mounted at build time only (id == SENTRY_AUTH_TOKEN); enables the
      # sentryVitePlugin sourcemap upload in vite.config.ts.
      BUILD_SECRETS: SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}

  sentry:
    name: Sentry release
    needs: ship
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Create Sentry release
        uses: getsentry/action-release@v1
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: fantasy-academy
          SENTRY_PROJECT: frontend
        with:
          environment: production
          version: ${{ github.sha }}
