# =============================================================================
# Frontend release — build ghcr.io/fantasy-academy/frontend and deploy it to lily.
# =============================================================================
# Same shared ship workflow as the backend, but a DIFFERENT app slug and a
# DIFFERENT HMAC secret, so this pipeline can only ever roll the frontend.
# See .github/workflows/backend-release.yml for the full rationale, and
# lily.srv docs/decisions.md → D42.
#
# Migrated from spare.srv 2026-07-27: was rsync + ssh-action into
# /deployment/fantasy-academy on spare with a full SSH key in CI.
#
# BOTH Sentry values go through `secrets:`, for two DIFFERENT reasons:
#   - SENTRY_AUTH_TOKEN is a real secret. It must not be a build arg: the shared
#     _build.yml emits an SLSA provenance attestation by default and build args are
#     recorded in it, so a build arg would publish the token next to the image.
#   - VITE_SENTRY_DSN is NOT secret (it ships inside the public JS bundle) and would
#     be fine as a build arg — except its value lives in a repo SECRET, and GitHub
#     does NOT allow the `secrets` context inside a reusable workflow's `with:`
#     block. Referencing it there is a hard workflow-VALIDATION error: the run dies
#     instantly with zero jobs, is named after the file path, and says only "This run
#     likely failed because of a workflow file issue". Hit exactly that on 2026-07-27.
#     `secrets:` is the one place the context IS available, so the DSN rides along in
#     BUILD_SECRETS and the Dockerfile reads it from a second secret mount.
#     (Tidier alternative: move the DSN to a repo VARIABLE — `vars.*` IS allowed in
#     `with:` — and keep it a build arg. Rejected only because that means re-entering
#     the value by hand instead of keeping one source of truth.)
# =============================================================================

name: Frontend release

permissions:
  contents: read
  packages: write

on:
  workflow_run:
    workflows: [Frontend tests]
    types:
      - completed
    branches:
      - main

jobs:
  ship:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    uses: TheDevs-cz/ci/.github/workflows/_ship.yml@v1
    permissions:
      contents: read
      packages: write
    with:
      app: fantasy-academy-frontend
      # Image is named after the COMPONENT, not the repo.
      image: ghcr.io/fantasy-academy/frontend
      context: ./frontend
      # The Dockerfile is multi-stage (dev -> build -> runner); ship the nginx
      # runner stage, not the toolchain.
      target: runner
      # NON-SECRET only, and NO `secrets` context here — see the header.
      build_args: |
        APP_VERSION=${{ github.sha }}
        VITE_APP_VERSION=${{ github.sha }}
      deploy_sha: true
      # See backend-release.yml — needs a per-app PAT on the box first.
      await_deploy: false
    secrets:
      DEPLOY_WEBHOOK_SECRET: ${{ secrets.DEPLOY_WEBHOOK_SECRET_FRONTEND }}
      # BuildKit secret MOUNTS, available only during the build RUN:
      #   SENTRY_AUTH_TOKEN -> enables the sentryVitePlugin sourcemap upload
      #   VITE_SENTRY_DSN   -> compiled into the bundle by Vite (public by design;
      #                        here only because its value lives in a repo secret)
      BUILD_SECRETS: |
        SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}
        VITE_SENTRY_DSN=${{ secrets.FRONTEND_SENTRY_DSN }}

  sentry:
    name: Sentry release
    needs: ship
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Create Sentry release
        uses: getsentry/action-release@v1
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: fantasy-academy
          SENTRY_PROJECT: frontend
        with:
          environment: production
          version: ${{ github.sha }}
